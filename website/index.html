<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>DatabaseMcpServer</title>
    <script>
      (() => {
        try {
          const mode = localStorage.getItem("dbmcp-color-mode") || "auto"
          const dark = mode === "dark" || mode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches
          document.documentElement.classList.toggle("dark", dark)
          document.documentElement.classList.toggle("light", !dark)
        }
        catch {}
        try {
          const stored = localStorage.getItem("dbmcp-locale")
          const locale = stored === "zh-CN" || stored === "en-US"
            ? stored
            : (navigator.language || "zh-CN").toLowerCase().startsWith("zh") ? "zh-CN" : "en-US"
          document.documentElement.lang = locale
          document.title = locale === "en-US"
            ? "DatabaseMcpServer Local Ops Console"
            : "DatabaseMcpServer 本地运维控制台"
        }
        catch {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
